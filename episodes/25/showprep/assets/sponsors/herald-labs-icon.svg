<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="title desc">
  <title id="title">Herald Labs icon</title>
  <desc id="desc">A minimal Herald Labs icon: dark rounded square, bold gold H monogram, green lab signal dot.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11111a"/>
      <stop offset="1" stop-color="#06060b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe680"/>
      <stop offset="0.55" stop-color="#f5c842"/>
      <stop offset="1" stop-color="#c98318"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="26" flood-color="#000" flood-opacity="0.48"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="230" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <rect x="262" y="306" width="154" height="432" rx="56" fill="url(#gold)"/>
    <rect x="608" y="306" width="154" height="432" rx="56" fill="url(#gold)"/>
    <rect x="370" y="448" width="284" height="130" rx="48" fill="url(#gold)"/>
  </g>
  <circle cx="512" cy="244" r="44" fill="#3dffa0"/>
  <circle cx="512" cy="244" r="78" fill="none" stroke="#3dffa0" stroke-opacity="0.26" stroke-width="18"/>
  <path d="M414 806 H610" stroke="#3dffa0" stroke-width="42" stroke-linecap="round" opacity="0.95"/>
</svg>
