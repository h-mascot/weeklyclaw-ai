<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 810" width="1400" height="810"  role="img" aria-label="Three timelines. A reactive harness is active only while handling each message. A reactive harness with cron also wakes on scheduled ticks to run a fixed checklist, and one tick sends a scheduled ping. Headlong thinks continuously; messages drop into the stream as observations and the agent replies when it chooses, and also pings people about its own projects."><defs><marker id="persistent-agency-b-f1Ba" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fd6e6"/></marker><marker id="persistent-agency-b-f1Bp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff96f2"/></marker><marker id="persistent-agency-b-f1Bm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8392"/></marker></defs><rect width="1400" height="810" fill="#000000"/><circle cx="880" cy="42" r="7" fill="#ff96f2"/><text x="896" y="48" font-family="'IBM Plex Sans', system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" fill="#7d8392" text-anchor="start" font-weight="400" >a message from a human</text><line x1="1165" y1="42" x2="1205" y2="42" stroke="#3fd6e6" stroke-width="6" stroke-linecap="round"/><text x="1217" y="48" font-family="'IBM Plex Sans', system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" fill="#7d8392" text-anchor="start" font-weight="400" >agent activity</text><line x1="40" y1="265" x2="1340" y2="265" stroke="#22272f" stroke-width="1" /><line x1="40" y1="495" x2="1340" y2="495" stroke="#22272f" stroke-width="1" /><text x="40" y="80" font-family="'IBM Plex Sans', system-ui, -apple-system, Segoe UI, sans-serif" font-size="30" fill="#c3c7d1" text-anchor="start" font-weight="600" >Reactive harness</text><text x="40" y="106" font-family="'IBM Plex Sans', system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" fill="#4b515c" text-anchor="start" font-weight="400" >e.g. Pi, Claude Code</text><text x="40" y="212" font-family="'IBM Plex Sans', system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" fill="#7d8392" text-anchor="start" font-weight="400" >Wakes when a message arrives, answers it, then sits frozen until the next one.</text><line x1="300" y1="150" x2="1340" y2="150" stroke="#0f3a41" stroke-width="4" stroke-linecap="round"/><circle cx="520" cy="110" r="7" fill="#ff96f2"/><line x1="520" y1="119" x2="520" y2="140" stroke="#ff96f2" stroke-width="2" marker-end="url(#persistent-agency-b-f1Bp)"/><circle cx="830" cy="110" r="7" fill="#ff96f2"/><line x1="830" y1="119" x2="830" y2="140" stroke="#ff96f2" stroke-width="2" marker-end="url(#persistent-agency-b-f1Bp)"/><circle cx="1110" cy="110" r="7" fill="#ff96f2"/><line x1="1110" y1="119" x2="1110" y2="140" stroke="#ff96f2" stroke-width="2" marker-end="url(#persistent-agency-b-f1Bp)"/><text x="40" y="310" font-family="'IBM Plex Sans', system-ui, -apple-system, Segoe UI, sans-serif" font-size="30" fill="#c3c7d1" text-anchor="start" font-weight="600" >Reactive with cron</text><text x="40" y="336" font-family="'IBM Plex Sans', system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" fill="#4b515c" text-anchor="start" font-weight="400" >e.g. OpenClaw, Hermes Agent</text><text x="40" y="442" font-family="'IBM Plex Sans', system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" fill="#7d8392" text-anchor="start" font-weight="400" >Replies right away, and a cron schedule also wakes it to run a fixed checklist, then it sleeps again.</text><line x1="300" y1="380" x2="1340" y2="380" stroke="#0f3a41" stroke-width="4" stroke-linecap="round"/><circle cx="520" cy="340" r="7" fill="#ff96f2"/><line x1="520" y1="349" x2="520" y2="370" stroke="#ff96f2" stroke-width="2" marker-end="url(#persistent-agency-b-f1Bp)"/><circle cx="830" cy="340" r="7" fill="#ff96f2"/><line x1="830" y1="349" x2="830" y2="370" stroke="#ff96f2" stroke-width="2" marker-end="url(#persistent-agency-b-f1Bp)"/><circle cx="1110" cy="340" r="7" fill="#ff96f2"/><line x1="1110" y1="349" x2="1110" y2="370" stroke="#ff96f2" stroke-width="2" marker-end="url(#persistent-agency-b-f1Bp)"/><text x="40" y="540" font-family="'IBM Plex Sans', system-ui, -apple-system, Segoe UI, sans-serif" font-size="30" fill="#98ffff" text-anchor="start" font-weight="600" >Headlong</text><text x="40" y="566" font-family="'IBM Plex Sans', system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" fill="#4b515c" text-anchor="start" font-weight="400" >e.g. Audel, our agent at Laude</text><text x="40" y="694" font-family="'IBM Plex Sans', system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" fill="#7d8392" text-anchor="start" font-weight="400" >Never asleep. Messages land as observations in a continuous thought stream;</text><circle cx="520" cy="570" r="7" fill="#ff96f2"/><line x1="520" y1="579" x2="520" y2="600" stroke="#ff96f2" stroke-width="2" marker-end="url(#persistent-agency-b-f1Bp)"/><circle cx="830" cy="570" r="7" fill="#ff96f2"/><line x1="830" y1="579" x2="830" y2="600" stroke="#ff96f2" stroke-width="2" marker-end="url(#persistent-agency-b-f1Bp)"/><circle cx="1110" cy="570" r="7" fill="#ff96f2"/><line x1="1110" y1="579" x2="1110" y2="600" stroke="#ff96f2" stroke-width="2" marker-end="url(#persistent-agency-b-f1Bp)"/><text x="40" y="720" font-family="'IBM Plex Sans', system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" fill="#7d8392" text-anchor="start" font-weight="400" >the agent decides if and when to reply, and what to think about in between.</text><rect x="514" y="142" width="66" height="16" rx="4" fill="#3fd6e6" stroke="none" stroke-width="0" /><line x1="574" y1="142" x2="574" y2="98" stroke="#3fd6e6" stroke-width="2.5" marker-end="url(#persistent-agency-b-f1Ba)"/><text x="574" y="88" font-family="'IBM Plex Sans